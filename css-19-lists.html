<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>CSS Lists</title>

<style>

ul{

list-style-type:square;

color:navy;

}

ol{

color:darkgreen;

}

</style>

</head>

<body>

<h1>Listas con CSS</h1>

<p>Ejemplo de lista desordenada:</p>

<ul>

<li>HTML</li>

<li>CSS</li>

<li>JavaScript</li>

</ul>

<p>Ejemplo de lista ordenada:</p>

<ol>

<li>Crear el HTML.</li>

<li>Aplicar estilos con CSS.</li>

<li>Probar la página en el navegador.</li>

</ol>

</body>

</html>
