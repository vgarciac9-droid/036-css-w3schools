<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSS Align</title>

    <style>

        body{
            font-family: Arial, sans-serif;
        }

        h1{
            text-align:center;
        }

        .caja{

            width:350px;
            margin:auto;
            background-color:#e8f4ff;
            padding:20px;
            border:2px solid steelblue;
            text-align:center;

        }

    </style>

</head>

<body>

<h1>Alineación en CSS</h1>

<div class="caja">

<p>

En esta práctica aprendí que también es posible
centrar elementos utilizando CSS.
Antes solo centraba el texto, ahora entiendo
que también puedo centrar cajas completas.

</p>

</div>

</body>

</html>
