<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSS Height and Width</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .caja {
            width: 300px;
            height: 150px;
            background-color: lightyellow;
            border: 2px solid orange;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Altura y anchura</h1>

    <div class="caja">
        Soy Vivi y esta caja tiene una anchura de 300 píxeles
        y una altura de 150 píxeles.
    </div>

</body>

</html>
