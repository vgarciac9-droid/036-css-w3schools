<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSS Padding</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .sin-padding {
            border: 2px solid black;
        }

        .con-padding {
            border: 2px solid purple;
            padding: 30px;
        }
    </style>
</head>

<body>

    <h1>Relleno en CSS</h1>

    <p class="sin-padding">
        Este texto queda pegado al borde.
    </p>

    <p class="con-padding">
        Este texto tiene espacio por dentro y se ve más cómodo.
        Ya entendí que padding no es lo mismo que margin.
    </p>

</body>

</html>
