<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>CSS Display</title>

<style>

div{

background-color:lightblue;

margin:10px;

padding:15px;

}

span{

display:block;

background-color:lightyellow;

padding:10px;

}

</style>

</head>

<body>

<h1>Propiedad Display</h1>

<div>Este elemento div ocupa toda la línea.</div>

<span>El elemento span normalmente es inline, pero aquí se muestra como block.</span>

</body>

</html>
