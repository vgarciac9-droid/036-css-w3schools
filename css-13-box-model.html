<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSS Box Model</title>

    <style>

        body{
            font-family: Arial, sans-serif;
        }

        .caja{

            width:300px;
            background-color:#e8f5e9;

            padding:25px;

            border:4px solid green;

            margin:40px;

        }

    </style>

</head>

<body>

<h1>Modelo de Caja</h1>

<div class="caja">

    <p>
        Cuando empecé CSS no entendía qué era el Box Model.
        Ahora veo que todo elemento tiene contenido,
        padding, borde y margen.
    </p>

</div>

</body>

</html>
