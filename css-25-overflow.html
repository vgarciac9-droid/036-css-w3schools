<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSS Overflow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .caja {
            width: 300px;
            height: 120px;
            border: 2px solid black;
            padding: 10px;
            overflow: auto;
            background-color: #fff8dc;
        }
    </style>
</head>

<body>

    <h1>Contenido desbordado</h1>

    <div class="caja">
        Este cuadro tiene una altura limitada. Cuando el contenido ya no cabe,
        aparece una barra de desplazamiento. Esta propiedad es útil cuando hay
        bastante texto y no queremos que el contenido se salga del elemento.
        También ayuda a mantener la página más ordenada.
    </div>

</body>

</html>
