<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSS Position</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            height: 900px;
        }

        .contenedor {
            position: relative;
            width: 500px;
            height: 250px;
            border: 2px solid black;
            background-color: #f2f2f2;
        }

        .caja {
            position: absolute;
            right: 20px;
            bottom: 20px;
            background-color: lightblue;
            padding: 15px;
        }

        .boton {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background-color: darkblue;
            color: white;
            padding: 12px;
        }
    </style>
</head>

<body>

    <h1>Posición de elementos</h1>

    <p>
        La propiedad position permite colocar elementos en diferentes partes de la página.
    </p>

    <div class="contenedor">
        <div class="caja">
            Esta caja está ubicada abajo y a la derecha del contenedor.
        </div>
    </div>

    <div class="boton">
        Botón fijo
    </div>

</body>

</html>
