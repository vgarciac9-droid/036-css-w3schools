<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSS Borders</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .borde-solido {
            border: 3px solid blue;
            padding: 15px;
        }

        .borde-punteado {
            border: 3px dotted purple;
            padding: 15px;
        }

        .borde-redondeado {
            border: 3px solid green;
            border-radius: 15px;
            padding: 15px;
        }
    </style>
</head>

<body>

    <h1>Probando bordes</h1>

    <p class="borde-solido">
        Este párrafo tiene un borde sólido.
    </p>

    <p class="borde-punteado">
        Este tiene un borde punteado, parece hecho con lapicero jajaja.
    </p>

    <p class="borde-redondeado">
        Este borde tiene esquinas redondeadas y se ve más bonito.
    </p>

</body>

</html>
