<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>CSS Combinators</title>

<style>

div p{

color:darkgreen;

}

</style>

</head>

<body>

<h1>Combinadores</h1>

<div>

<p>

Este párrafo cambia de color porque
está dentro del elemento div.

</p>

</div>

<p>

Este párrafo permanece con el color normal
porque está fuera del div.

</p>

</body>

</html>
