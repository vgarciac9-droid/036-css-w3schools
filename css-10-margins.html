<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSS Margins</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .caja1 {
            background-color: lightblue;
            margin: 20px;
            padding: 15px;
        }

        .caja2 {
            background-color: lightgreen;
            margin: 50px;
            padding: 15px;
        }
    </style>
</head>

<body>

    <h1>Márgenes en CSS</h1>

    <div class="caja1">
        Esta caja tiene un margen pequeño.
    </div>

    <div class="caja2">
        Esta tiene más espacio alrededor. Ahora entiendo por qué
        algunas cosas en la página no quedan pegadas.
    </div>

</body>

</html>
