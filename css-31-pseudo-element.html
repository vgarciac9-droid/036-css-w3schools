<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>CSS Pseudo-element</title>

<style>

p::first-letter{

font-size:40px;

color:blue;

font-weight:bold;

}

</style>

</head>

<body>

<h1>Pseudo-elementos</h1>

<p>

Con esta propiedad la primera letra del párrafo
se muestra diferente al resto del texto.

</p>

</body>

</html>
