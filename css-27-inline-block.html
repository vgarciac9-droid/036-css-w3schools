<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSS Inline-block</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .opcion {
            display: inline-block;
            width: 140px;
            padding: 15px;
            margin: 5px;
            background-color: lightgreen;
            border: 1px solid green;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Elementos Inline-block</h1>

    <p>
        Los elementos pueden colocarse en la misma línea y conservar un tamaño definido.
    </p>

    <div class="opcion">Inicio</div>
    <div class="opcion">Cursos</div>
    <div class="opcion">Contacto</div>

</body>

</html>
