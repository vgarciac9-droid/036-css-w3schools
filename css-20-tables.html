<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>CSS Tables</title>

<style>

table{

border-collapse:collapse;

width:60%;

}

table,th,td{

border:1px solid black;

}

th{

background-color:#4CAF50;

color:white;

}

th,td{

padding:10px;

text-align:center;

}

tr:nth-child(even){

background-color:#f2f2f2;

}

</style>

</head>

<body>

<h1>Tablas con CSS</h1>

<table>

<tr>

<th>Curso</th>

<th>Estado</th>

</tr>

<tr>

<td>HTML</td>

<td>Finalizado</td>

</tr>

<tr>

<td>CSS</td>

<td>En proceso</td>

</tr>

<tr>

<td>JavaScript</td>

<td>Pendiente</td>

</tr>

</table>

</body>

</html>
