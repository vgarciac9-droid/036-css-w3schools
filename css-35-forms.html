<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>CSS Forms</title>

<style>

body{

font-family:Arial, sans-serif;

background:#f4f4f4;

}

form{

width:350px;

margin:40px auto;

padding:20px;

background:white;

border-radius:10px;

box-shadow:0 0 8px rgba(0,0,0,.2);

}

input, textarea{

width:100%;

padding:10px;

margin-bottom:15px;

border:1px solid #ccc;

border-radius:5px;

box-sizing:border-box;

}

button{

background:#2ecc71;

color:white;

border:none;

padding:10px 20px;

cursor:pointer;

border-radius:5px;

}

button:hover{

background:#27ae60;

}

</style>

</head>

<body>

<form>

<h2>Formulario de práctica</h2>

<label>Nombre</label>

<input type="text" placeholder="Escribe tu nombre">

<label>Correo</label>

<input type="email" placeholder="correo@ejemplo.com">

<label>Comentario</label>

<textarea rows="4" placeholder="Escribe un comentario..."></textarea>

<button type="submit">

Enviar

</button>

</form>

</body>

</html>
