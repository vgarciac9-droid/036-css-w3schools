<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>CSS Opacity</title>

<style>

body{

font-family:Arial;

}

img{

opacity:0.5;

width:250px;

}

img:hover{

opacity:1;

}

</style>

</head>

<body>

<h1>Opacidad</h1>

<p>

La imagen inicia con menos intensidad
y al colocar el cursor recupera su color normal.

</p>

<img src="https://www.w3schools.com/html/img_chania.jpg">

</body>

</html>
