<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>CSS Navigation Bar</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
}

ul{
    list-style-type:none;
    margin:0;
    padding:0;
    overflow:hidden;
    background-color:#2c3e50;
}

li{
    float:left;
}

li a{
    display:block;
    color:white;
    text-align:center;
    padding:16px 20px;
    text-decoration:none;
}

li a:hover{
    background-color:#1abc9c;
}

main{
    padding:25px;
}

</style>

</head>

<body>

<ul>

<li><a href="#">Inicio</a></li>
<li><a href="#">Sobre mí</a></li>
<li><a href="#">Prácticas</a></li>
<li><a href="#">Contacto</a></li>

</ul>

<main>

<h1>Barra de navegación</h1>

<p>

En esta práctica aprendí cómo crear un menú sencillo.
Es el tipo de navegación que normalmente se encuentra
en la parte superior de una página web.

</p>

</main>

</body>

</html>
