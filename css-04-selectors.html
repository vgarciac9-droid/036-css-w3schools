<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSS Selectors</title>

    <style>

        h1{
            color: blue;
        }

        .parrafo{
            color: green;
        }

        #especial{
            color:red;
        }

    </style>

</head>

<body>

<h1>Selectores CSS</h1>

<p class="parrafo">Este párrafo usa una clase.</p>

<p id="especial">Este párrafo usa un ID.</p>

</body>

</html>
