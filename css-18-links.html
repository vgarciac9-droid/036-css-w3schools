<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>CSS Links</title>

<style>

body{
    font-family: Arial, sans-serif;
}

a:link{
    color:blue;
}

a:visited{
    color:purple;
}

a:hover{
    color:red;
}

a:active{
    color:green;
}

</style>

</head>

<body>

<h1>Enlaces con CSS</h1>

<p>
En esta práctica aprendí que un enlace puede cambiar de color
dependiendo de la acción del usuario.
</p>

<a href="https://www.w3schools.com" target="_blank">
Visitar W3Schools
</a>

</body>

</html>
